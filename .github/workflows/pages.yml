name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "tools/feed.mjs", ".github/workflows/pages.yml"]
  # the snapshot bot pushes with GITHUB_TOKEN, which doesn't fire push events
  workflow_run:
    workflows: [snapshot]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node tools/feed.mjs
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
