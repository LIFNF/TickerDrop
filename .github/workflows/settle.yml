name: settle
on:
  schedule:
    - cron: "31 13,14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry:
        description: Validate without sending transactions
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci --omit=dev
      - name: Obtain independent signed reports
        run: node keeper/prepare.mjs
        env:
          QUOTE_ATTESTOR_URLS: ${{ vars.QUOTE_ATTESTOR_URLS }}
      - name: Validate and settle
        run: node keeper/settle.mjs
        env:
          RELAYER_KEY: ${{ secrets.RELAYER_KEY }}
          DRY: ${{ inputs.dry && '1' || '0' }}
      - run: node tools/feed.mjs
      - name: Save verified feed
        run: |
          git add data/verified-sessions.json
          git diff --cached --quiet && exit 0
          git config user.name tickerdrop-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish verified settlement feed"
          git push
