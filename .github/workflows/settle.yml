name: settle

# 09:30 New York is 13:30 UTC in summer, 14:30 UTC in winter. Both slots fire;
# the script settles once the market is actually open and exits otherwise.
on:
  schedule:
    - cron: "31 13 * * 1-5"
    - cron: "31 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry:
        description: "print the rounds without sending"
        type: boolean
        default: false

concurrency:
  group: settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node keeper/settle.mjs
        env:
          REPORTER_KEY: ${{ secrets.REPORTER_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          DRY: ${{ inputs.dry && '1' || '0' }}
