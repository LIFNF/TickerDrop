name: automation-credential-health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-signers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        signer: [1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --omit=dev
      - name: Verify one isolated hosted signer
        run: node keeper/check-automation.mjs
        env:
          AUTOMATION_KEY: ${{ secrets[format('AUTO_SIGNER_KEY_{0}', matrix.signer)] }}
  verify-relayer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --omit=dev
      - name: Verify funded relayer
        run: node keeper/check-automation.mjs --relayer
        env:
          AUTOMATION_KEY: ${{ secrets.RELAYER_KEY }}
